<!DOCTYPE html>
<html lang="zh-CN" data-canvas-width="1440" data-canvas-height="900" style="width:1440px;height:900px;margin:0;padding:0;box-sizing:border-box;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440, initial-scale=1.0">
<title>曙光跑腿管理端 - 登录</title>
</head>
<body data-canvas-root style="width:1440px;height:900px;margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F5F6F8;display:block;">
<!-- 左侧品牌区 -->
<main style="position:relative;width:1440px;height:842px;box-sizing:border-box;display:flex;">
  <section style="width:560px;height:842px;box-sizing:border-box;background:linear-gradient(150deg,#FF8A3D 0%,#FF6B2C 55%,#F2531C 100%);position:relative;flex-shrink:0;overflow:hidden;display:flex;flex-direction:column;padding:48px 48px 40px;">
    <!-- 装饰圆 -->
    <div style="position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.10);"></div>
    <div style="position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);"></div>
    <div style="position:absolute;left:-90px;bottom:120px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);"></div>

    <!-- Logo 行 -->
    <div style="display:flex;align-items:center;gap:12px;position:relative;z-index:2;">
      <div style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div>
        <div style="font-size:22px;font-weight:700;color:#fff;letter-spacing:1px;">曙光跑腿</div>
        <div style="font-size:12px;color:rgba(255,255,255,.85);margin-top:2px;">平台运营管理端</div>
      </div>
    </div>

    <!-- 标语区 -->
    <div style="margin-top:96px;position:relative;z-index:2;">
      <div style="font-size:30px;font-weight:700;color:#fff;line-height:1.45;letter-spacing:1px;">让每个村庄的订单<br/>都被认真送达</div>
      <div style="margin-top:18px;font-size:14px;color:rgba(255,255,255,.88);line-height:1.8;">覆盖乡镇农村的跑腿与外卖一体化平台，统一管理<br/>订单、商家、骑手与资金结算。</div>
    </div>

    <!-- 数据条 -->
    <div style="margin-top:auto;position:relative;z-index:2;display:flex;gap:32px;">
      <div>
        <div style="font-size:26px;font-weight:700;color:#fff;">12,800+</div>
        <div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:4px;">覆盖乡镇</div>
      </div>
      <div style="width:1px;height:40px;background:rgba(255,255,255,.3);"></div>
      <div>
        <div style="font-size:26px;font-weight:700;color:#fff;">8.6万+</div>
        <div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:4px;">服务用户</div>
      </div>
      <div style="width:1px;height:40px;background:rgba(255,255,255,.3);"></div>
      <div>
        <div style="font-size:26px;font-weight:700;color:#fff;">4,320+</div>
        <div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:4px;">合作骑手</div>
      </div>
    </div>

    <div style="position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(0deg,rgba(0,0,0,.06),transparent);"></div>
  </section>

  <!-- 右侧登录区 -->
  <section style="flex:1;display:flex;align-items:center;justify-content:center;background:#F5F6F8;">
    <div style="width:420px;">
      <div style="font-size:26px;font-weight:700;color:#1D2129;">欢迎回来</div>
      <div style="font-size:14px;color:#86909C;margin-top:8px;">登录曙光跑腿平台运营管理端</div>

      <!-- 表单 -->
      <div style="margin-top:32px;">
        <label style="display:block;font-size:13px;color:#4E5969;margin-bottom:8px;">账号</label>
        <div style="display:flex;align-items:center;background:#fff;border:1px solid #E5E6EB;border-radius:8px;height:48px;padding:0 14px;box-sizing:border-box;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" value="admin@shuguang" style="flex:1;border:none;outline:none;font-size:14px;color:#1D2129;margin-left:10px;font-family:inherit;" placeholder="请输入管理员账号"/>
        </div>

        <label style="display:block;font-size:13px;color:#4E5969;margin:20px 0 8px;">密码</label>
        <div style="display:flex;align-items:center;background:#fff;border:1px solid #E5E6EB;border-radius:8px;height:48px;padding:0 14px;box-sizing:border-box;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" value="shuguang2026" style="flex:1;border:none;outline:none;font-size:14px;color:#1D2129;margin-left:10px;font-family:inherit;" placeholder="请输入密码"/>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;cursor:pointer;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>

        <label style="display:block;font-size:13px;color:#4E5969;margin:20px 0 8px;">验证码</label>
        <div style="display:flex;gap:12px;">
          <div style="flex:1;display:flex;align-items:center;background:#fff;border:1px solid #E5E6EB;border-radius:8px;height:48px;padding:0 14px;box-sizing:border-box;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l2.5 2.5L16 8"/></svg>
            <input type="text" value="8A6K" style="flex:1;border:none;outline:none;font-size:14px;color:#1D2129;margin-left:10px;font-family:inherit;letter-spacing:4px;" placeholder="请输入验证码"/>
          </div>
          <div style="width:128px;height:48px;border-radius:8px;background:#FFF3E8;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex-shrink:0;">
            <span style="font-size:16px;font-weight:700;color:#FF6B2C;letter-spacing:3px;">8A6K</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;">
          <div style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <div style="width:16px;height:16px;border-radius:4px;background:#FF6B2C;display:flex;align-items:center;justify-content:center;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span style="font-size:13px;color:#4E5969;">记住账号</span>
          </div>
          <span style="font-size:13px;color:#FF6B2C;cursor:pointer;">忘记密码？</span>
        </div>

        <button style="width:100%;height:48px;margin-top:28px;border:none;border-radius:8px;background:linear-gradient(135deg,#FF8A3D,#FF6B2C);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(255,107,44,.35);">登 录</button>
      </div>

      <div style="margin-top:32px;display:flex;align-items:center;gap:12px;">
        <div style="flex:1;height:1px;background:#E5E6EB;"></div>
        <span style="font-size:12px;color:#86909C;">安全提示：请勿在公共设备上保存密码</span>
        <div style="flex:1;height:1px;background:#E5E6EB;"></div>
      </div>
    </div>
  </section>
</main>
  <div data-canvas-bottom-safe-area="58" style="height:58px;width:1440px;flex-shrink:0;background:linear-gradient(90deg,#F2531C 0,#F2531C 560px,#F5F6F8 560px,#F5F6F8 1440px);"></div>
</body>
</html>
