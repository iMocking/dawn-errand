<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 订单追踪</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color:#1D2129; position:relative;
  }
  .map {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 50%, #E0F2F1 100%);
  }
  .road-h { position:absolute; background:#fff; height:12px; left:0; right:0; }
  .road-v { position:absolute; background:#fff; width:12px; top:0; bottom:0; }
  .road-h.r1 { top:30%; }
  .road-h.r2 { top:60%; }
  .road-v.c1 { left:25%; }
  .road-v.c2 { left:70%; }
  .route {
    position:absolute; top:28%; left:26%; width:44%; height:34%;
    border-top:3px dashed #FF6B2C; transform:rotate(8deg);
    border-radius:50%;
  }
  .pin-pickup {
    position:absolute; top:26%; left:22%;
    width:32px; height:32px; background:#00B578; border-radius:50%;
    border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center; z-index:3;
  }
  .rider-pin {
    position:absolute; top:44%; left:52%;
    width:40px; height:40px; background:#FF6B2C; border-radius:50%;
    border:3px solid #fff; box-shadow:0 4px 12px rgba(255,107,44,.4);
    display:flex; align-items:center; justify-content:center; z-index:5;
  }
  .pin-dest {
    position:absolute; top:60%; left:68%;
    width:32px; height:32px; background:#FF4D4F; border-radius:50%;
    border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center; z-index:3;
  }
  .nav {
    position:absolute; top:0; left:0; right:0; z-index:10;
    padding:44px 16px 0; display:flex; justify-content:space-between;
  }
  .nav-btn {
    width:36px; height:36px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .status-card {
    position:absolute; top:90px; left:16px; right:16px;
    background:#fff; border-radius:14px; padding:16px; z-index:10;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
  }
  .status-title { font-size:16px; font-weight:700; margin-bottom:4px; }
  .status-desc { font-size:13px; color:#4E5969; margin-bottom:12px; }
  .eta-row { display:flex; gap:24px; }
  .eta-item .num { font-size:20px; font-weight:700; color:#FF6B2C; }
  .eta-item .lbl { font-size:11px; color:#86909C; }
  .rider-card {
    position:absolute; bottom:0; left:0; right:0; z-index:10;
    background:#fff; border-radius:16px 16px 0 0; padding:16px 16px 24px;
    box-shadow:0 -4px 16px rgba(0,0,0,.08);
  }
  .rider-row { display:flex; align-items:center; gap:12px; }
  .rider-avatar {
    width:48px; height:48px; border-radius:50%; background:#FFE0B2;
    display:flex; align-items:center; justify-content:center;
  }
  .rider-info { flex:1; }
  .rider-name { font-size:15px; font-weight:600; }
  .rider-meta { font-size:12px; color:#86909C; margin-top:2px; }
  .rider-actions { display:flex; gap:10px; }
  .action-btn {
    width:44px; height:44px; border-radius:50%; background:#F2F3F5;
    display:flex; align-items:center; justify-content:center;
  }
  .action-btn.call { background:#FFF3E8; }
  .progress { margin-top:14px; padding-top:14px; border-top:1px solid #F2F3F5; }
  .progress-step { display:flex; gap:10px; font-size:12px; padding:3px 0; align-items:center; }
  .progress-step .dot { width:6px; height:6px; border-radius:50%; background:#C9CDD4; }
  .progress-step.done .dot { background:#00B578; }
  .progress-step.todo { color:#86909C; }
</style>
</head>
<body>
  <div class="map">
    <div class="road-h r1"></div>
    <div class="road-h r2"></div>
    <div class="road-v c1"></div>
    <div class="road-v c2"></div>
    <div class="route"></div>
    <div class="pin-pickup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M4 11l1 9h14l1-9"/></svg>
    </div>
    <div class="rider-pin">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg>
    </div>
    <div class="pin-dest">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
  </div>

  <div class="nav">
    <div class="nav-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#1D2129"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </div>
  </div>

  <div class="status-card">
    <div class="status-title">骑手正在配送中</div>
    <div class="status-desc">骑手张师傅已取餐，正赶往王家湾村</div>
    <div class="eta-row">
      <div class="eta-item"><div class="num">12</div><div class="lbl">预计送达(分钟)</div></div>
      <div class="eta-item"><div class="num">1.8</div><div class="lbl">剩余距离(公里)</div></div>
    </div>
  </div>

  <div class="rider-card">
    <div class="rider-row">
      <div class="rider-avatar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D48806" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="rider-info">
        <div class="rider-name">张师傅 · 鄂J·D8888</div>
        <div class="rider-meta">接单1286 · 好评率99% · 曙光骑手</div>
      </div>
      <div class="rider-actions">
        <div class="action-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5969" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="action-btn call">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
      </div>
    </div>
    <div class="progress">
      <div class="progress-step done"><div class="dot"></div>订单已提交，商家已接单</div>
      <div class="progress-step done"><div class="dot"></div>骑手已到店取餐</div>
      <div class="progress-step done"><div class="dot"></div>配送中，已行驶3.4公里</div>
      <div class="progress-step todo"><div class="dot"></div>送达确认，期待您的评价</div>
    </div>
  </div>
</body>
</html>
