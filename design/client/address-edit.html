<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 编辑地址</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; position:relative; flex-shrink:0;
  }
  .nav .back { position:absolute; left:16px; display:flex; align-items:center; }
  .nav .save { position:absolute; right:16px; color:#FF6B2C; font-size:15px; }
  .content { flex:1; overflow-y:auto; padding:12px 16px; }
  .card { background:#fff; border-radius:12px; padding:4px 16px; margin-bottom:12px; }
  .row {
    display:flex; align-items:center; padding:14px 0; border-bottom:1px solid #F2F3F5;
  }
  .row:last-child { border-bottom:none; }
  .row .label { font-size:14px; color:#86909C; width:80px; flex-shrink:0; }
  .row input {
    flex:1; border:none; outline:none; font-size:15px; color:#1D2129;
  }
  .row input::placeholder { color:#C9CDD4; }
  .tag-row { display:flex; gap:8px; padding:14px 0; }
  .atag {
    padding:5px 12px; border-radius:14px; background:#F5F6F8; font-size:12px; color:#4E5969;
  }
  .atag.active { background:#FFF3E8; color:#FF6B2C; }
</style>
</head>
<body>
  <div class="nav">
    <span class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </span>
    编辑地址
    <span class="save">保存</span>
  </div>
  <div class="content">
    <div class="card">
      <div class="row">
        <span class="label">收货人</span>
        <input type="text" value="王建国">
      </div>
      <div class="row">
        <span class="label">手机号</span>
        <input type="tel" value="138 8888 8888">
      </div>
      <div class="row">
        <span class="label">所在村组</span>
        <input type="text" value">
      </div>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">详细地址</span>
        <input type="text" value="三组26号 · 红砖大铁门，门口有棵大樟树">
      </div>
      <div class="row">
        <span class="label">地标备注</span>
        <input type="text" placeholder="如：红砖大铁门、老樟树下">
      </div>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">地址标签</span>
      </div>
      <div class="tag-row">
        <div class="atag active">家</div>
        <div class="atag">公司</div>
        <div class="atag">爸妈家</div>
        <div class="atag">打工住的地方</div>
      </div>
    </div>
  </div>
</body>
</html>
