<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 地址管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129; position:relative;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; position:relative;
  }
  .nav .back { position:absolute; left:16px; display:flex; align-items:center; }
  .list { padding:10px 16px 100px; }
  .addr-card {
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px;
    display:flex; gap:12px;
  }
  .addr-main { flex:1; }
  .addr-user { font-size:15px; font-weight:600; margin-bottom:4px; }
  .addr-user small { font-weight:400; color:#4E5969; margin-left:8px; }
  .addr-detail { font-size:13px; color:#4E5969; line-height:1.5; margin-bottom:6px; }
  .addr-tag {
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:4px;
    background:#FFF3E8; color:#FF6B2C; margin-right:4px;
  }
  .addr-tag.default { background:#E8F7F0; color:#00B578; }
  .addr-actions { display:flex; gap:16px; font-size:12px; color:#86909C; align-items:center; }
  .add-btn {
    position:absolute; bottom:24px; left:16px; right:16px; height:48px;
    background:linear-gradient(90deg,#FF8A3D,#FF5A1F); color:#fff;
    border-radius:24px; font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 4px 12px rgba(255,107,44,.3);
  }
</style>
</head>
<body>
  <div class="nav">
    <span class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </span>
    收货地址
  </div>
  <div class="list">
    <div class="addr-card">
      <div class="addr-main">
        <div class="addr-user">王建国 <small>138****8888</small></div>
        <div class="addr-detail">湖北省黄冈市浠水县<br>王家湾村三组26号 · 红砖大铁门，门口有棵樟树</div>
        <div><span class="addr-tag default">默认</span><span class="addr-tag">家</span></div>
      </div>
      <div class="addr-actions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
    </div>

    <div class="addr-card">
      <div class="addr-main">
        <div class="addr-user">王秀兰 <small>137****6666</small></div>
        <div class="addr-detail">湖北省黄冈市浠水县<br>绿杨乡卫生院住院部 2楼3床</div>
        <div><span class="addr-tag">医院</span></div>
      </div>
      <div class="addr-actions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
    </div>

    <div class="addr-card">
      <div class="addr-main">
        <div class="addr-user">王强 <small>135****9999</small></div>
        <div class="addr-detail">湖北省黄冈市浠水县<br>兰溪中学 高三(2)班宿舍</div>
        <div><span class="addr-tag">学校</span></div>
      </div>
      <div class="addr-actions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
    </div>
  </div>
  <div class="add-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新增收货地址
  </div>
</body>
</html>
