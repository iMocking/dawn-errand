<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 我的订单</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; flex-shrink:0;
  }
  .filter-tabs {
    background:#fff; display:flex; padding:0 16px;
    border-bottom:1px solid #F2F3F5; flex-shrink:0;
  }
  .filter-tab {
    flex:1; text-align:center; padding:12px 0; font-size:14px; color:#4E5969;
    position:relative;
  }
  .filter-tab.active { color:#FF6B2C; font-weight:600; }
  .filter-tab.active::after {
    content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:24px; height:3px; background:#FF6B2C; border-radius:2px;
  }
  .list { flex:1; overflow-y:auto; padding:10px 16px 20px; }
  .order-card {
    background:#fff; border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .order-head {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:10px; border-bottom:1px solid #F2F3F5; margin-bottom:10px;
  }
  .shop { font-size:14px; font-weight:600; }
  .status { font-size:13px; font-weight:600; }
  .status.ongoing { color:#FF6B2C; }
  .status.done { color:#86909C; }
  .order-body { display:flex; gap:10px; }
  .o-img {
    width:56px; height:56px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .o-info { flex:1; }
  .o-name { font-size:13px; color:#4E5969; margin-bottom:4px; }
  .o-time { font-size:11px; color:#86909C; }
  .o-total { font-size:14px; font-weight:600; text-align:right; }
  .o-total small { font-size:11px; color:#86909C; font-weight:400; display:block; }
  .order-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  .btn { padding:6px 16px; border-radius:16px; font-size:13px; }
  .btn-outline { border:1px solid #E5E6EB; color:#4E5969; background:#fff; }
  .btn-primary { background:#FF6B2C; color:#fff; }
</style>
</head>
<body>
  <div class="nav">我的订单</div>
  <div class="filter-tabs">
    <div class="filter-tab active">进行中</div>
    <div class="filter-tab">已完成</div>
    <div class="filter-tab">已取消</div>
    <div class="filter-tab">退款/售后</div>
  </div>
  <div class="list">
    <div class="order-card">
      <div class="order-head">
        <span class="shop">村口老陈家常菜</span>
        <span class="status ongoing">配送中</span>
      </div>
      <div class="order-body">
        <div class="o-img" style="background:#FFF0E0">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M4 11l1 9h14l1-9"/></svg>
        </div>
        <div class="o-info">
          <div class="o-name">农家小炒肉、西红柿炒蛋、米饭×2</div>
          <div class="o-time">今天 12:30 · 预计12:45送达</div>
        </div>
        <div class="o-total">¥32.3<small>实付</small></div>
      </div>
      <div class="order-actions">
        <div class="btn btn-outline">取消订单</div>
        <div class="btn btn-primary">查看配送</div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-head">
        <span class="shop">王家湾综合超市</span>
        <span class="status done">已完成</span>
      </div>
      <div class="order-body">
        <div class="o-img" style="background:#E8F5E9">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#52C41A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M9 21V13h6v8"/></svg>
        </div>
        <div class="o-info">
          <div class="o-name">纯牛奶×2箱、洗衣粉×1、抽纸×3</div>
          <div class="o-time">昨天 18:20 · 已送达</div>
        </div>
        <div class="o-total">¥86.5<small>实付</small></div>
      </div>
      <div class="order-actions">
        <div class="btn btn-outline">再来一单</div>
        <div class="btn btn-outline">评价</div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-head">
        <span class="shop">跑腿代办 · 镇中心</span>
        <span class="status done">已完成</span>
      </div>
      <div class="order-body">
        <div class="o-img" style="background:#E8F7F0">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00B578" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M4 22l4-4 3 2 5-5 4 3"/><path d="M12 22v-5l-3-2V9l4-2 4 3 2"/></svg>
        </div>
        <div class="o-info">
          <div class="o-name">帮取快递（镇邮政所→王家湾村）</div>
          <div class="o-time">10月20日 15:10 · 已送达</div>
        </div>
        <div class="o-total">¥6.0<small>实付</small></div>
      </div>
      <div class="order-actions">
        <div class="btn btn-outline">再次下单</div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-head">
        <span class="shop">乡里乡亲水果店</span>
        <span class="status done">已完成</span>
      </div>
      <div class="order-body">
        <div class="o-img" style="background:#FCE4EC">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#EB2F96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M12 9c-3 0-5-2-5-5 3 0 5 2 5 5 0-3 2-5 5-5 0 3-2 5-5 5"/></svg>
        </div>
        <div class="o-info">
          <div class="o-name">红富士苹果5斤、香蕉1把、葡萄2斤</div>
          <div class="o-time">10月18日 10:00 · 已送达</div>
        </div>
        <div class="o-total">¥45.8<small>实付</small></div>
      </div>
      <div class="order-actions">
        <div class="btn btn-outline">再来一单</div>
        <div class="btn btn-outline">评价</div>
      </div>
    </div>
  </div>
</body>
</html>
