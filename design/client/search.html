<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 搜索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .search-bar {
    background:#fff; padding:50px 16px 12px; display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .back-btn {
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }
  .input-wrap {
    flex:1; background:#F5F6F8; border-radius:20px; height:38px;
    display:flex; align-items:center; padding:0 14px; gap:8px;
  }
  .input-wrap input {
    flex:1; border:none; outline:none; background:transparent; font-size:14px;
  }
  .search-btn { color:#FF6B2C; font-size:15px; font-weight:600; }
  .content { flex:1; overflow-y:auto; padding:16px; }
  .hot-title { font-size:14px; font-weight:600; margin-bottom:12px; }
  .hot-tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .hot-tag {
    padding:6px 14px; border-radius:16px; background:#fff; font-size:13px;
    color:#4E5969;
  }
  .hot-tag.hot { background:#FFF3E8; color:#FF6B2C; }
  .history-title { font-size:14px; font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .history-list { background:#fff; border-radius:12px; padding:4px 16px; }
  .history-item {
    padding:12px 0; border-bottom:1px solid #F2F3F5; font-size:14px; color:#4E5969;
    display:flex; justify-content:space-between; align-items:center;
  }
  .history-item:last-child { border-bottom:none; }
</style>
</head>
<body>
  <div class="search-bar">
    <div class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="input-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="搜商家、搜商品" value="小炒肉">
    </div>
    <div class="search-btn">搜索</div>
  </div>
  <div class="content">
    <div class="hot-title">🔥 热门搜索</div>
    <div class="hot-tags">
      <div class="hot-tag hot">小炒肉</div>
      <div class="hot-tag">大米</div>
      <div class="hot-tag">卤味</div>
      <div class="hot-tag hot">超市</div>
      <div class="hot-tag">水果</div>
      <div class="hot-tag">感冒药</div>
      <div class="hot-tag">快递</div>
      <div class="hot-tag">烟</div>
    </div>
    <div class="history-title">
      <span>最近搜过</span>
      <span style="font-size:12px;color:#86909C;font-weight:400">清空</span>
    </div>
    <div class="history-list">
      <div class="history-item">农家小炒肉
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9CDD4" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="history-item">王家湾超市
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9CDD4" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="history-item">西红柿炒蛋
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9CDD4" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
