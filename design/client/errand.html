<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 跑腿下单</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; border-bottom:1px solid #F2F3F5; position:relative;
    flex-shrink:0;
  }
  .nav .back { position:absolute; left:16px; display:flex; align-items:center; }
  .content { flex:1; overflow-y:auto; padding:10px 16px 100px; }
  .type-tabs { display:flex; gap:8px; margin-bottom:10px; }
  .type-tab {
    flex:1; background:#fff; border-radius:10px; padding:12px 4px; text-align:center;
    border:2px solid transparent;
  }
  .type-tab.active { border-color:#FF6B2C; background:#FFF3E8; }
  .type-tab .icon { display:flex; justify-content:center; margin-bottom:4px; }
  .type-tab .name { font-size:13px; font-weight:500; }
  .type-tab.active .name { color:#FF6B2C; }
  .card {
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px;
    position:relative;
  }
  .addr-row { display:flex; gap:10px; padding:10px 0; }
  .addr-row + .addr-row { border-top:1px solid #F2F3F5; }
  .dot {
    width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0;
  }
  .dot.start { background:#00B578; }
  .dot.end { background:#FF4D4F; }
  .addr-body { flex:1; }
  .addr-label { font-size:12px; color:#86909C; margin-bottom:2px; }
  .addr-input { font-size:15px; color:#1D2129; }
  .swap {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:50%; background:#F2F3F5;
    display:flex; align-items:center; justify-content:center;
  }
  .desc-box {
    width:100%; border:1px solid #E5E6EB; border-radius:8px; padding:10px;
    font-size:14px; color:#4E5969; margin-top:8px; min-height:60px; line-height:1.6;
  }
  .desc-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .desc-tag {
    padding:4px 10px; background:#F2F3F5; border-radius:12px; font-size:12px; color:#4E5969;
    display:flex; align-items:center; gap:4px;
  }
  .fee-card { background:#FFF8E0; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .fee-row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:#86909C; }
  .fee-row.total { color:#1D2129; font-size:15px; font-weight:600; padding-top:8px; border-top:1px dashed #FFD66B; margin-top:6px; }
  .fee-row.total .price { color:#FF4D4F; font-size:20px; }
  .footer-bar {
    position:absolute; bottom:0; left:0; right:0; height:68px; background:#fff;
    border-top:1px solid #E5E6EB; display:flex; align-items:center; padding:0 16px;
  }
  .price-box { flex:1; }
  .price-box .label { font-size:11px; color:#86909C; }
  .price-box .amount { font-size:20px; color:#FF4D4F; font-weight:700; }
  .submit-btn {
    background:linear-gradient(90deg,#FF8A3D,#FF5A1F); color:#fff;
    padding:12px 32px; border-radius:24px; font-size:16px; font-weight:600;
    box-shadow:0 4px 12px rgba(255,107,44,.3);
  }
</style>
</head>
<body>
  <div class="nav">
    <span class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </span>
    跑腿代办
  </div>
  <div class="content">
    <div class="type-tabs">
      <div class="type-tab active">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </div>
        <div class="name">帮我买</div>
      </div>
      <div class="type-tab">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E5969" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/></svg>
        </div>
        <div class="name">帮我送</div>
      </div>
      <div class="type-tab">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E5969" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div class="name">帮我取</div>
      </div>
      <div class="type-tab">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4E5969" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
        </div>
        <div class="name">帮我办</div>
      </div>
    </div>

    <div class="card">
      <div class="addr-row">
        <div class="dot start"></div>
        <div class="addr-body">
          <div class="addr-label">取货地址</div>
          <div class="addr-input">镇中心供销社超市</div>
          <div class="addr-label" style="margin-top:4px">联系人：刘老板 139****5678</div>
        </div>
      </div>
      <div class="swap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </div>
      <div class="addr-row">
        <div class="dot end"></div>
        <div class="addr-body">
          <div class="addr-label">收货地址</div>
          <div class="addr-input">王家湾村三组26号</div>
          <div class="addr-label" style="margin-top:4px">王建国 138****8888</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">买什么</div>
      <div class="desc-box">
        1. 金龙鱼食用油5L装 ×1桶<br>
        2. 东北大米10kg ×1袋<br>
        3. 生抽酱油 ×1瓶
      </div>
      <div class="desc-tags">
        <div class="desc-tag">品牌商品</div>
        <div class="desc-tag">先行垫付</div>
        <div class="desc-tag">买前拍照确认</div>
      </div>
    </div>

    <div class="fee-card">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">费用预估</div>
      <div class="fee-row"><span>跑腿费（5.2km）</span><span>¥8.0</span></div>
      <div class="fee-row"><span>商品垫付（实报实销）</span><span>约 ¥120</span></div>
      <div class="fee-row total"><span>需预付跑腿费</span><span class="price">¥8.0</span></div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="price-box">
      <div class="label">跑腿费</div>
      <div class="amount">¥8.0</div>
    </div>
    <div class="submit-btn">立即下单</div>
  </div>
</body>
</html>
