<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 个人中心</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body {
    width:375px; height:812px; overflow-y:auto; overflow-x:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
  }
  .header {
    background:linear-gradient(180deg,#FF8A3D,#FF6B2C);
    padding:54px 20px 60px; color:#fff;
  }
  .user-row { display:flex; align-items:center; gap:14px; }
  .avatar {
    width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,.5);
  }
  .user-name { font-size:20px; font-weight:700; }
  .user-phone { font-size:13px; opacity:.9; margin-top:4px; }
  .assets-card {
    margin:-40px 16px 0; background:#fff; border-radius:12px; padding:16px 0;
    display:flex; box-shadow:0 4px 16px rgba(0,0,0,.06); position:relative; z-index:2;
  }
  .asset-item { flex:1; text-align:center; }
  .asset-item .num { font-size:18px; font-weight:700; }
  .asset-item .lbl { font-size:11px; color:#86909C; margin-top:2px; }
  .section-card {
    margin:10px 16px; background:#fff; border-radius:12px; padding:14px 16px;
  }
  .section-head {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
  }
  .section-title { font-size:15px; font-weight:600; }
  .section-more { font-size:12px; color:#86909C; display:flex; align-items:center; gap:2px; }
  .order-icons { display:flex; justify-content:space-around; }
  .oi { text-align:center; }
  .oi .icon { display:flex; justify-content:center; margin-bottom:4px; }
  .oi .label { font-size:11px; color:#4E5969; }
  .menu-row {
    display:flex; align-items:center; padding:14px 0; border-bottom:1px solid #F2F3F5;
    font-size:14px;
  }
  .menu-row:last-child { border-bottom:none; }
  .menu-icon { width:24px; margin-right:12px; display:flex; align-items:center; }
  .menu-label { flex:1; }
  .menu-val { font-size:12px; color:#86909C; margin-right:6px; }
  .arrow { color:#C9CDD4; display:flex; align-items:center; }
</style>
</head>
<body>
  <div class="header">
    <div class="user-row">
      <div class="avatar">

      </div>
      <div>

    </div>

  <div class="assets-card">
    <div class="asset-item"><div class="num">2</div><div class="lbl">优惠券</div></div>
    <div class="asset-item"><div class="num">¥15</div><div class="lbl">余额</div></div>
    <div class="asset-item"><div class="num">128</div><div class="lbl">积分</div></div>

    <div class="menu-row">
      <span class="menu-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#722ED1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg></span>
