<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 商家详情</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column; position:relative;
  }
  /* 顶部导航浮层 */
  .nav {
    position:absolute; top:0; left:0; right:0; z-index:10;
    padding:50px 16px 0; display:flex; justify-content:space-between;
  }
  .nav-btn {
    width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  /* 商家头图横幅 */
  .hero {
    height:160px; background:linear-gradient(135deg,#FF8A3D,#FF5A1F); flex-shrink:0;
    display:flex; align-items:flex-end; padding:16px; color:#fff;
  }
  .hero-badge {
    background:rgba(255,255,255,.25); padding:4px 10px; border-radius:10px;
    font-size:12px; backdrop-filter:blur(4px);
  }
  /* 商家信息卡 */
  .shop-card {
    background:#fff; margin:-16px 16px 0; border-radius:14px; padding:16px;
    position:relative; z-index:2;
  }
  .shop-name { font-size:18px; font-weight:700; margin-bottom:6px; }
  .shop-meta { display:flex; gap:12px; font-size:12px; color:#86909C; }
  .shop-tags { display:flex; gap:6px; margin-top:10px; }
  .stag {
    font-size:11px; padding:3px 8px; border-radius:4px; background:#FFF3E8; color:#FF6B2C;
  }
  .stag.green { background:#E8F7F0; color:#00B578; }
  /* 横向分类Tab */
  .cat-tabs {
    display:flex; gap:8px; padding:14px 16px 10px; overflow-x:auto; flex-shrink:0;
  }
  .cat-tab {
    padding:6px 14px; border-radius:16px; background:#fff; font-size:13px;
    color:#4E5969; white-space:nowrap; flex-shrink:0;
  }
  .cat-tab.active { background:#FF6B2C; color:#fff; font-weight:600; }
  /* 商品列表 - 大图横向 */
  .goods-list { flex:1; overflow-y:auto; padding:0 16px 100px; }
  .dish-card {
    background:#fff; border-radius:12px; margin-bottom:10px; overflow:hidden;
    display:flex;
  }
  .dish-img {
    width:110px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .dish-info { flex:1; padding:12px; display:flex; flex-direction:column; justify-content:space-between; }
  .dish-name { font-size:15px; font-weight:600; margin-bottom:4px; }
  .dish-desc { font-size:12px; color:#86909C; line-height:1.4; margin-bottom:8px; }
  .dish-bottom { display:flex; justify-content:space-between; align-items:center; }
  .dish-price { font-size:16px; font-weight:700; color:#FF4D4F; }
  .dish-price small { font-size:11px; font-weight:400; }
  .add-btn {
    width:28px; height:28px; border-radius:50%; background:#FF6B2C; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  /* 底部购物车栏 */
  .cart-bar {
    position:absolute; bottom:0; left:0; right:0; height:64px; background:#1D2129;
    display:flex; align-items:center; padding:0 16px 8px; z-index:10;
  }
  .cart-icon {
    width:48px; height:48px; border-radius:50%; background:#FF6B2C;
    display:flex; align-items:center; justify-content:center; margin-left:-10px;
    position:relative;
  }
  .cart-badge {
    position:absolute; top:-2px; right:-2px; background:#FF4D4F; color:#fff;
    font-size:10px; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .cart-info { flex:1; margin-left:14px; color:#fff; }
  .cart-total { font-size:18px; font-weight:700; }
  .cart-delivery { font-size:11px; color:#86909C; }
  .checkout-btn {
    background:#FF6B2C; color:#fff; padding:10px 24px; border-radius:20px;
    font-size:15px; font-weight:600;
  }
</style>
</head>
<body>
  <div class="nav">
    <div class="nav-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </div>
  </div>

  <div class="hero">
    <div class="hero-badge">🔥 本周热销 · 已售326份</div>
  </div>

  <div class="shop-card">
    <div class="shop-name">村口老陈家常菜</div>
    <div class="shop-meta">
      <span>⭐ 4.8分</span>
      <span>📏 2.1km</span>
      <span>⏱ 约25分钟</span>
    </div>
    <div class="shop-tags">
      <span class="stag">满25免配送</span>
      <span class="stag green">新用户立减3元</span>
    </div>
  </div>

  <div class="cat-tabs">
    <div class="cat-tab active">🔥 热销爆款</div>
    <div class="cat-tab">招牌炒菜</div>
    <div class="cat-tab">家常小炒</div>
    <div class="cat-tab">汤类炖菜</div>
    <div class="cat-tab">主食米饭</div>
  </div>

  <div class="goods-list">
    <div class="dish-card">
      <div class="dish-img" style="background:#FFF0E0">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M4 11l1 9h14l1-9"/></svg>
      </div>
      <div class="dish-info">
        <div>
          <div class="dish-name">农家小炒肉</div>
          <div class="dish-desc">招牌土猪肉现炒，香辣下饭 · 月售86份</div>
        </div>
        <div class="dish-bottom">
          <div class="dish-price"><small>¥</small>16.8</div>
          <div class="add-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="dish-card">
      <div class="dish-img" style="background:#FFE0D6">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
      </div>
      <div class="dish-info">
        <div>
          <div class="dish-name">红烧土鸡块</div>
          <div class="dish-desc">散养土鸡慢炖，入味软烂 · 月售64份</div>
        </div>
        <div class="dish-bottom">
          <div class="dish-price"><small>¥</small>28.0</div>
          <div class="add-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="dish-card">
      <div class="dish-img" style="background:#E8F5E9">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#52C41A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8M12 8C7 8 5 5 5 2c3 0 7 1 7 6 0-5 4-6 7-6 0 3-2 6-7 6"/></svg>
      </div>
      <div class="dish-info">
        <div>
          <div class="dish-name">手撕包菜</div>
          <div class="dish-desc">本地包菜大火快炒，脆嫩爽口 · 月售52份</div>
        </div>
        <div class="dish-bottom">
          <div class="dish-price"><small>¥</small>12.0</div>
          <div class="add-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="dish-card">
      <div class="dish-img" style="background:#FFF8E1">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FAAD14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
      </div>
      <div class="dish-info">
        <div>
          <div class="dish-name">西红柿炒蛋</div>
          <div class="dish-desc">农家土鸡蛋，酸甜可口 · 月售78份</div>
        </div>
        <div class="dish-bottom">
          <div class="dish-price"><small>¥</small>10.0</div>
          <div class="add-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-bar">
    <div class="cart-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <div class="cart-badge">2</div>
    </div>
    <div class="cart-info">
      <div class="cart-total">¥30.8</div>
      <div class="cart-delivery">另需配送费 ¥3</div>
    </div>
    <div class="checkout-btn">去结算</div>
  </div>
</body>
</html>
