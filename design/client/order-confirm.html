<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿 - 确认订单</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center;
    padding:0 16px; font-size:17px; font-weight:600; border-bottom:1px solid #F2F3F5;
    flex-shrink:0; position:relative;
  }
  .nav .back { position:absolute; left:16px; display:flex; align-items:center; }
  .nav .title { position:absolute; left:50%; transform:translateX(-50%); }
  .content { flex:1; overflow-y:auto; padding:10px 16px 90px; }
  .card {
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px;
  }
  .addr-card { display:flex; gap:12px; align-items:flex-start; }
  .addr-icon {
    width:40px; height:40px; border-radius:50%; background:#FFF3E8;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .addr-main { flex:1; }
  .addr-user { font-size:15px; font-weight:600; margin-bottom:4px; }
  .addr-user small { font-weight:400; color:#4E5969; margin-left:8px; }
  .addr-detail { font-size:13px; color:#4E5969; line-height:1.5; }
  .arrow { color:#C9CDD4; display:flex; align-items:center; }
  .shop-name { font-size:15px; font-weight:600; margin-bottom:12px; }
  .g-row {
    display:flex; justify-content:space-between; font-size:14px; padding:5px 0;
    color:#4E5969;
  }
  .g-row .num { color:#86909C; }
  .divider { height:1px; background:#F2F3F5; margin:10px 0; }
  .fee-row {
    display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:#4E5969;
  }
  .fee-row.red { color:#FF4D4F; }
  .section-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; font-size:14px; border-bottom:1px solid #F2F3F5;
  }
  .section-row:last-child { border-bottom:none; }
  .section-row .label { color:#4E5969; }
  .section-row .val { color:#1D2129; font-weight:500; }
  .section-row .val.hint { color:#86909C; font-weight:400; font-size:13px; display:flex; align-items:center; gap:4px; }
  .footer-bar {
    position:absolute; bottom:0; left:0; right:0; height:68px; background:#fff;
    border-top:1px solid #E5E6EB; display:flex; align-items:center; padding:0 16px;
  }
  .total-box { flex:1; }
  .total-box .amount { font-size:20px; color:#FF4D4F; font-weight:700; }
  .total-box .amount small { font-size:13px; }
  .submit-btn {
    background:linear-gradient(90deg,#FF8A3D,#FF5A1F); color:#fff;
    padding:12px 28px; border-radius:24px; font-size:16px; font-weight:600;
    box-shadow:0 4px 12px rgba(255,107,44,.3);
  }
</style>
</head>
<body>
  <div class="nav">
    <span class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </span>
    <span class="title">确认订单</span>
  </div>
  <div class="content">
    <div class="card">
      <div class="addr-card">
        <div class="addr-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="addr-main">
          <div class="addr-user">王建国 <small>138****8888</small></div>
          <div class="addr-detail">湖北省黄冈市浠水县<br>王家湾村三组26号 · 红砖大铁门，门口有棵樟树</div>
        </div>
        <div class="arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="shop-name">村口老陈家常菜</div>
      <div class="g-row"><span>农家小炒肉 ×1</span><span>¥16.8</span></div>
      <div class="g-row"><span>西红柿炒蛋 ×1</span><span>¥10.0</span></div>
      <div class="g-row"><span>米饭 ×2</span><span class="num">¥4.0</span></div>
      <div class="divider"></div>
      <div class="fee-row"><span>商品小计</span><span>¥30.8</span></div>
      <div class="fee-row"><span>配送费</span><span>¥3.0</span></div>
      <div class="fee-row"><span>打包费</span><span>¥1.5</span></div>
      <div class="fee-row red"><span>新用户立减</span><span>-¥3.0</span></div>
    </div>

    <div class="card">
      <div class="section-row">
        <span class="label">送达时间</span>
        <span class="val">尽快送达（约25分钟）</span>
      </div>
      <div class="section-row">
        <span class="label">配送方式</span>
        <span class="val">曙光跑腿骑手</span>
      </div>
      <div class="section-row">
        <span class="label">订单备注</span>
        <span class="val hint">少辣，米饭要热的
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </div>
    </div>

    <div class="card">
      <div class="section-row">
        <span class="label">支付方式</span>
        <span class="val">微信支付
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00B578" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </div>
      <div class="section-row">
        <span class="label">优惠券</span>
        <span class="val hint">已减 ¥3
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="total-box">
      <div class="amount"><small>合计 </small>¥32.3</div>
    </div>
    <div class="submit-btn">提交订单</div>
  </div>
</body>
</html>
