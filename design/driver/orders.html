<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿骑手端 - 我的订单</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; border-bottom:1px solid #F2F3F5; flex-shrink:0;
  }
  .filter-tabs {
    background:#fff; display:flex; padding:0 16px; border-bottom:1px solid #F2F3F5; flex-shrink:0;
  }
  .filter-tab {
    flex:1; text-align:center; padding:12px 0; font-size:14px; color:#4E5969; position:relative;
  }
  .filter-tab.active { color:#FF6B2C; font-weight:600; }
  .filter-tab.active::after {
    content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:24px; height:3px; background:#FF6B2C; border-radius:2px;
  }
  .list { flex:1; overflow-y:auto; padding:10px 16px 20px; }
  .order-card {
    background:#fff; border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .order-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .order-time { font-size:12px; color:#86909C; }
  .order-status { font-size:12px; color:#00B578; font-weight:600; }
  .order-route { font-size:14px; line-height:1.5; padding:6px 0; }
  .order-route .from { color:#FF6B2C; }
  .order-route .arrow { color:#C9CDD4; margin:0 4px; }
  .order-route .to { color:#1D2129; }
  .order-foot {
    display:flex; justify-content:space-between; align-items:center; padding-top:8px;
    border-top:1px solid #F2F3F5; margin-top:6px;
  }
  .order-type { font-size:11px; color:#86909C; }
  .order-earn { font-size:15px; font-weight:700; color:#FF4D4F; }
</style>
</head>
<body>
  <div class="nav">我的订单</div>
  <div class="filter-tabs">
    <div class="filter-tab active">全部</div>
    <div class="filter-tab">配送中</div>
    <div class="filter-tab">已完成</div>
    <div class="filter-tab">已取消</div>
  </div>
  <div class="list">
    <div class="order-card">
      <div class="order-head">
        <span class="order-time">今天 12:35 完成</span>
        <span class="order-status">已送达</span>
      </div>
      <div class="order-route">
        <span class="from">村口老陈家常菜</span>
        <span class="arrow">→</span>
        <span class="to">王家湾村三组26号</span>
      </div>
      <div class="order-foot">
        <span class="order-type">外卖配送 · 2.3km</span>
        <span class="order-earn">+¥7.0</span>
      </div>
    </div>
    <div class="order-card">
      <div class="order-head">
        <span class="order-time">今天 11:20 完成</span>
        <span class="order-status">已送达</span>
      </div>
      <div class="order-route">
        <span class="from">镇中心供销社超市</span>
        <span class="arrow">→</span>
        <span class="to">绿杨乡中学宿舍3栋</span>
      </div>
      <div class="order-foot">
        <span class="order-type">帮我买 · 1.8km</span>
        <span class="order-earn">+¥8.5</span>
      </div>
    </div>
    <div class="order-card">
      <div class="order-head">
        <span class="order-time">今天 10:05 完成</span>
        <span class="order-status">已送达</span>
      </div>
      <div class="order-route">
        <span class="from">乡里乡亲水果店</span>
        <span class="arrow">→</span>
        <span class="to">王家湾村七组</span>
      </div>
      <div class="order-foot">
        <span class="order-type">外卖配送 · 4.1km</span>
        <span class="order-earn">+¥7.0</span>
      </div>
    </div>
    <div class="order-card">
      <div class="order-head">
        <span class="order-time">昨天 18:40 完成</span>
        <span class="order-status">已送达</span>
      </div>
      <div class="order-route">
        <span class="from">镇中心大药房</span>
        <span class="arrow">→</span>
        <span class="to">王家湾村五组</span>
      </div>
      <div class="order-foot">
        <span class="order-type">帮我送 · 3.5km</span>
        <span class="order-earn">+¥6.0</span>
      </div>
    </div>
    <div class="order-card">
      <div class="order-head">
        <span class="order-time">昨天 17:15 完成</span>
        <span class="order-status">已送达</span>
      </div>
      <div class="order-route">
        <span class="from">镇邮政代办点</span>
        <span class="arrow">→</span>
        <span class="to">王家湾村三组</span>
      </div>
      <div class="order-foot">
        <span class="order-type">帮我取快递 · 2.8km</span>
        <span class="order-earn">+¥5.0</span>
      </div>
    </div>
  </div>
</body>
</html>
