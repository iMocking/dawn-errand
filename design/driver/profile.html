<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿骑手端 - 我的</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow-y:auto; overflow-x:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
  }
  .header {
    background:linear-gradient(135deg,#FF6B2C,#FF5A1F);
    padding:54px 16px 24px; color:#fff;
  }
  .rider-row { display:flex; align-items:center; gap:12px; }
  .rider-avatar {
    width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
  }
  .rider-name { font-size:18px; font-weight:700; }
  .rider-desc { font-size:12px; opacity:.9; margin-top:4px; }
  .level-badge {
    display:inline-block; background:#FFD666; color:#874D00; font-size:11px;
    padding:2px 8px; border-radius:8px; margin-top:6px; font-weight:600;
  }
  .stats-row {
    display:flex; background:#fff; margin:10px 16px; border-radius:12px; padding:16px 0;
  }
  .stat-item { flex:1; text-align:center; }
  .stat-item .n { font-size:20px; font-weight:700; }
  .stat-item .t { font-size:11px; color:#86909C; margin-top:2px; }
  .menu-card {
    margin:0 16px 10px; background:#fff; border-radius:12px; padding:4px 16px;
  }
  .menu-row {
    display:flex; align-items:center; padding:14px 0; border-bottom:1px solid #F2F3F5;
    font-size:14px;
  }
  .menu-row:last-child { border-bottom:none; }
  .menu-icon { width:24px; margin-right:12px; display:flex; align-items:center; }
  .menu-label { flex:1; }
  .menu-val { font-size:12px; color:#86909C; margin-right:6px; }
  .arrow { color:#C9CDD4; display:flex; align-items:center; }
</style>
</head>

  <div class="header">

</body>
