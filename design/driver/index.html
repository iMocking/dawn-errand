<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>曙光跑腿 · 骑手端 UI 设计稿预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#ECEEF1; padding:40px 20px;
  }
  .header { text-align:center; margin-bottom:40px; }
  .header h1 { font-size:32px; color:#1D2129; margin-bottom:8px; }
  .header p { color:#86909C; font-size:14px; }
  .brand-info {
    display:inline-flex; gap:16px; margin-top:16px; align-items:center;
    background:#fff; padding:12px 24px; border-radius:12px;
  }
  .swatch {
    display:inline-block; width:20px; height:20px; border-radius:50%;
    vertical-align:middle; margin-right:6px; border:1px solid rgba(0,0,0,.1);
  }
  .grid {
    display:flex; flex-wrap:wrap; gap:32px; justify-content:center;
    max-width:1900px; margin:0 auto;
  }
  .phone-wrap { text-align:center; }
  .phone {
    width:375px; height:812px; border-radius:44px; overflow:hidden;
    border:10px solid #1D2129; box-shadow:0 20px 60px rgba(0,0,0,.15);
    background:#fff; position:relative;
  }
  .phone iframe {
    width:100%; height:100%; border:none; display:block; overflow:hidden;
  }
  .phone-label {
    margin-top:16px; font-size:14px; color:#4E5969; font-weight:500;
  }
  .phone-label small { display:block; color:#86909C; font-size:12px; margin-top:2px; font-weight:400; }
</style>
</head>
<body>
  <div class="header">
    <h1>曙光跑腿 · 骑手端 App UI</h1>
    <p>乡镇跑腿骑手专用 · 接单 / 配送 / 导航 / 日结提现 · 统一曙光橙色系</p>
    <div class="brand-info">
      <span><span class="swatch" style="background:#FF6B2C"></span>主色 #FF6B2C</span>
      <span><span class="swatch" style="background:#FF4D4F"></span>奖励 #FF4D4F</span>
      <span><span class="swatch" style="background:#00B578"></span>完成 #00B578</span>
      <span>375 × 812</span>
    </div>
  </div>
  <div class="grid">
    <div class="phone-wrap">
      <div class="phone"><iframe src="login.html" scrolling="no"></iframe></div>
      <div class="phone-label">骑手登录<small>手机号注册 / 入驻审核</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="home.html" scrolling="no"></iframe></div>
      <div class="phone-label">工作台<small>上线开关 / 今日收入 / 进行中订单</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="order-pool.html" scrolling="no"></iframe></div>
      <div class="phone-label">接单大厅<small>附近可接订单 / 抢单</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="order-detail.html" scrolling="no"></iframe></div>
      <div class="phone-label">配送详情<small>取送货地址 / 联系电话 / 收入</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="navigation.html" scrolling="no"></iframe></div>
      <div class="phone-label">导航页<small>模拟地图 / 路线 / ETA</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="orders.html" scrolling="no"></iframe></div>
      <div class="phone-label">我的订单<small>历史订单 / 收入记录</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="checkin.html" scrolling="no"></iframe></div>
      <div class="phone-label">每日签到<small>连续签到 / 奖励规则</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="finance.html" scrolling="no"></iframe></div>
      <div class="phone-label">收入提现<small>日结 / 流水记录</small></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><iframe src="profile.html" scrolling="no"></iframe></div>
      <div class="phone-label">骑手中心<small>等级 / 评分 / 配送范围</small></div>
    </div>
  </div>
</body>
</html>
