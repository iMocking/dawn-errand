<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿商家端 - 菜品管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; font-size:17px; font-weight:600; border-bottom:1px solid #F2F3F5; flex-shrink:0;
  }
  .add-btn { color:#FF6B2C; font-size:15px; font-weight:500; display:flex; align-items:center; gap:2px; }
  .cat-tabs {
    display:flex; background:#fff; border-bottom:1px solid #F2F3F5; flex-shrink:0;
  }
  .cat-tab {
    padding:12px 16px; font-size:14px; color:#4E5969; white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .cat-tab.active { color:#FF6B2C; border-bottom-color:#FF6B2C; font-weight:600; }
  .list { flex:1; overflow-y:auto; padding:10px 16px 80px; }
  .dish-card {
    background:#fff; border-radius:12px; padding:12px; margin-bottom:10px;
    display:flex; gap:12px;
  }
  .d-img {
    width:64px; height:64px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .d-info { flex:1; }
  .d-name { font-size:14px; font-weight:600; margin-bottom:4px; }
  .d-meta { font-size:12px; color:#86909C; margin-bottom:6px; }
  .d-price { font-size:15px; color:#FF4D4F; font-weight:700; }
  .d-price small { font-size:11px; font-weight:400; }
  .d-actions { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .switch {
    width:40px; height:22px; border-radius:11px; background:#FF6B2C;
    position:relative; cursor:pointer;
  }
  .switch::after {
    content:""; position:absolute; right:2px; top:2px; width:18px; height:18px;
    border-radius:50%; background:#fff;
  }
  .switch.off { background:#C9CDD4; }
  .switch.off::after { right:auto; left:2px; }
  .edit-link { font-size:12px; color:#86909C; }
</style>
</head>
<body>
  <div class="nav">
    <span>菜品管理</span>
    <div class="add-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新增菜品
    </div>
  </div>
  <div class="cat-tabs">
    <div class="cat-tab active">热销爆款</div>
    <div class="cat-tab">招牌炒菜</div>
    <div class="cat-tab">家常小炒</div>
    <div class="cat-tab">汤类炖菜</div>
    <div class="cat-tab">主食</div>
  </div>
  <div class="list">
    <div class="dish-card">
      <div class="d-img" style="background:#FFF0E0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M4 11l1 9h14l1-9"/></svg>
      </div>
      <div class="d-info">
        <div class="d-name">农家小炒肉</div>
        <div class="d-meta">月售86 · 库存充足</div>
        <div class="d-price"><small>¥</small>16.8</div>
      </div>
      <div class="d-actions">
        <div class="switch"></div>
        <span class="edit-link">编辑</span>
      </div>
    </div>

    <div class="dish-card">
      <div class="d-img" style="background:#FFE0D6">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
      </div>
      <div class="d-info">
        <div class="d-name">红烧土鸡块</div>
        <div class="d-meta">月售64 · 库存仅剩8份</div>
        <div class="d-price"><small>¥</small>28.0</div>
      </div>
      <div class="d-actions">
        <div class="switch"></div>
        <span class="edit-link">编辑</span>
      </div>
    </div>

    <div class="dish-card">
      <div class="d-img" style="background:#E8F5E9">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#52C41A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8M12 8C7 8 5 5 5 2c3 0 7 1 7 6 0-5 4-6 7-6 0 3-2 6-7 6"/></svg>
      </div>
      <div class="d-info">
        <div class="d-name">手撕包菜</div>
        <div class="d-meta">月售52 · 已售罄</div>
        <div class="d-price"><small>¥</small>12.0</div>
      </div>
      <div class="d-actions">
        <div class="switch off"></div>
        <span class="edit-link">编辑</span>
      </div>
    </div>

    <div class="dish-card">
      <div class="d-img" style="background:#FFF8E1">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FAAD14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
      </div>
      <div class="d-info">
        <div class="d-name">西红柿炒蛋</div>
        <div class="d-meta">月售78 · 库存充足</div>
        <div class="d-price"><small>¥</small>10.0</div>
      </div>
      <div class="d-actions">
        <div class="switch"></div>
        <span class="edit-link">编辑</span>
      </div>
    </div>

    <div class="dish-card">
      <div class="d-img" style="background:#FFEBEE">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F5222D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 6 6 9 6 13a6 6 0 0 0 12 0c0-4-2-7-6-11z"/></svg>
      </div>
      <div class="d-info">
        <div class="d-name">麻婆豆腐</div>
        <div class="d-meta">月售45 · 库存充足</div>
        <div class="d-price"><small>¥</small>11.0</div>
      </div>
      <div class="d-actions">
        <div class="switch"></div>
        <span class="edit-link">编辑</span>
      </div>
    </div>
  </div>
</body>
</html>
