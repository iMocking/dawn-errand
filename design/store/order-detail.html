<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿商家端 - 订单详情</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; position:relative; flex-shrink:0;
  }
  .nav .back { position:absolute; left:16px; display:flex; align-items:center; }
  .content { flex:1; overflow-y:auto; padding:10px 16px 100px; }
  .status-card {
    background:linear-gradient(135deg,#FF8A3D,#FF5A1F); color:#fff;
    border-radius:12px; padding:20px 16px; margin-bottom:10px;
  }
  .status-card .big { font-size:20px; font-weight:700; margin-bottom:4px; }
  .status-card .small { font-size:13px; opacity:.9; }
  .card {
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px;
  }
  .card-title { font-size:14px; font-weight:600; color:#86909C; margin-bottom:10px; }
  .cust-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .cust-name { font-size:16px; font-weight:600; }
  .cust-phone { font-size:14px; color:#4E5969; }
  .call-btn {
    width:36px; height:36px; border-radius:50%; background:#FFF3E8;
    display:flex; align-items:center; justify-content:center; margin-left:auto;
  }
  .addr { font-size:13px; color:#4E5969; line-height:1.6; }
  .item-row {
    display:flex; justify-content:space-between; padding:8px 0; font-size:14px;
  }
  .item-row .n { color:#1D2129; }
  .item-row .p { color:#4E5969; }
  .price-row {
    display:flex; justify-content:space-between; padding:4px 0; font-size:13px;
    color:#4E5969;
  }
  .price-row.total { font-size:15px; color:#FF4D4F; font-weight:700; padding-top:8px; border-top:1px solid #F2F3F5; margin-top:8px; }
  .remark {
    background:#FFF8E0; border-radius:8px; padding:10px 12px; font-size:13px;
    color:#D48806; margin-top:10px;
  }
  .order-meta { font-size:12px; color:#86909C; line-height:2; }
  .bottom-bar {
    position:absolute; bottom:0; left:0; right:0; background:#fff;
    padding:12px 16px 24px; display:flex; gap:10px; border-top:1px solid #E5E6EB;
  }
  .btn { flex:1; height:44px; border-radius:22px; font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; }
  .btn-outline { border:1px solid #E5E6EB; color:#4E5969; background:#fff; }
  .btn-primary { background:#FF6B2C; color:#fff; }
</style>
</head>
<body>
  <div class="nav">
    <span class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2129" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </span>
    订单详情
  </div>
  <div class="content">
    <div class="status-card">
      <div class="big">已接单 · 待制作</div>
      <div class="small">接单时间 12:28 · 预计12:50前出餐</div>
    </div>

    <div class="card">
      <div class="card-title">顾客信息</div>
      <div class="cust-row">
        <div>
          <div class="cust-name">王建国</div>
          <div class="cust-phone">138 8888 8888</div>
        </div>
        <div class="call-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.72.37 1.42.72 2.06a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.66.36 1.36.61 2.08.73A2 2 0 0 1 22 16.92z"/></svg>
        </div>
      </div>
      <div class="addr">湖北省黄冈市浠水县 · 王家湾村三组26号（红砖大铁门，门口有棵大樟树）</div>
    </div>

    <div class="card">
      <div class="card-title">商品明细</div>
      <div class="item-row"><span class="n">农家小炒肉 ×1</span><span class="p">¥16.8</span></div>
      <div class="item-row"><span class="n">西红柿炒蛋 ×1</span><span class="p">¥10.0</span></div>
      <div class="item-row"><span class="n">米饭 ×2</span><span class="p">¥4.0</span></div>
      <div class="price-row"><span>商品小计</span><span>¥30.8</span></div>
      <div class="price-row"><span>配送费</span><span>¥3.0</span></div>
      <div class="price-row"><span>新用户立减</span><span style="color:#FF4D4F">-¥3.0</span></div>
      <div class="price-row total"><span>实付</span><span>¥30.8</span></div>
      <div class="remark">📝 顾客备注：少辣，米饭要热一点</div>
    </div>

    <div class="card">
      <div class="card-title">订单信息</div>
      <div class="order-meta">
        订单编号：20261022001<br>
        下单时间：今天 12:26<br>
        支付方式：微信支付<br>
        配送方式：曙光跑腿骑手
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="btn btn-outline">联系顾客</div>
    <div class="btn btn-primary">通知骑手取餐</div>
  </div>
</body>
</html>
