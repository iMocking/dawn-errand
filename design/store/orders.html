<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿商家端 - 订单管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F6F8; color:#1D2129;
    display:flex; flex-direction:column;
  }
  .nav {
    height:44px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; flex-shrink:0; border-bottom:1px solid #F2F3F5;
  }
  .filter-tabs {
    background:#fff; display:flex; padding:0 16px;
    border-bottom:1px solid #F2F3F5; flex-shrink:0;
  }
  .filter-tab {
    flex:1; text-align:center; padding:12px 0; font-size:14px; color:#4E5969;
    position:relative;
  }
  .filter-tab.active { color:#FF6B2C; font-weight:600; }
  .filter-tab.active::after {
    content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:24px; height:3px; background:#FF6B2C; border-radius:2px;
  }
  .filter-tab .count {
    display:inline-block; background:#FF4D4F; color:#fff; font-size:10px;
    padding:1px 5px; border-radius:8px; margin-left:2px;
  }
  .list { flex:1; overflow-y:auto; padding:10px 16px 20px; }
  .order-card {
    background:#fff; border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .order-head {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:10px; border-bottom:1px solid #F2F3F5; margin-bottom:10px;
  }
  .order-no { font-size:13px; color:#86909C; }
  .status { font-size:13px; font-weight:600; }
  .status.pending { color:#FF4D4F; }
  .status.cooking { color:#FF6B2C; }
  .status.delivering { color:#2B7FFF; }
  .cust-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .cust-name { font-size:15px; font-weight:600; }
  .call-btn {
    width:32px; height:32px; border-radius:50%; background:#FFF3E8;
    display:flex; align-items:center; justify-content:center;
  }
  .cust-addr { font-size:12px; color:#86909C; margin-bottom:10px; line-height:1.5; }
  .items { font-size:13px; color:#4E5969; margin-bottom:8px; line-height:1.6; }
  .order-foot {
    display:flex; justify-content:space-between; align-items:center; padding-top:10px;
    border-top:1px solid #F2F3F5;
  }
  .total { font-size:15px; font-weight:700; color:#FF4D4F; }
  .actions { display:flex; gap:8px; }
  .btn { padding:7px 16px; border-radius:16px; font-size:13px; font-weight:500; }
  .btn-outline { border:1px solid #E5E6EB; color:#4E5969; background:#fff; }
  .btn-primary { background:#FF6B2C; color:#fff; }
  .btn-danger { background:#fff; color:#FF4D4F; border:1px solid #FF4D4F; }
</style>
</head>
<body>
  <div class="nav">订单管理</div>
  <div class="filter-tabs">
    <div class="filter-tab active">待接单<span class="count">2</span></div>
    <div class="filter-tab">制作中<span class="count">3</span></div>
    <div class="filter-tab">配送中</div>
    <div class="filter-tab">已完成</div>
  </div>
  <div class="list">
    <!-- 待接单1 -->
    <div class="order-card">
      <div class="order-head">
        <span class="order-no">订单 #20261022001</span>
        <span class="status pending">待接单</span>
      </div>
      <div class="cust-row">
        <span class="cust-name">王建国</span>
        <div class="call-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.72.37 1.42.72 2.06a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.66.36 1.36.61 2.08.73A2 2 0 0 1 22 16.92z"/></svg>
        </div>
      </div>
      <div class="cust-addr">王家湾村三组26号 · 138****8888</div>
      <div class="items">农家小炒肉×1、西红柿炒蛋×1、米饭×2</div>
      <div class="order-foot">
        <span class="total">¥32.3</span>
        <div class="actions">
          <div class="btn btn-danger">拒单</div>
          <div class="btn btn-primary">接单</div>
        </div>
      </div>
    </div>

    <!-- 待接单2 -->
    <div class="order-card">
      <div class="order-head">
        <span class="order-no">订单 #20261022002</span>
        <span class="status pending">待接单</span>
      </div>
      <div class="cust-row">
        <span class="cust-name">李秀英</span>
        <div class="call-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.72.37 1.42.72 2.06a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.66.36 1.36.61 2.08.73A2 2 0 0 1 22 16.92z"/></svg>
        </div>
      </div>
      <div class="cust-addr">王家湾村五组 · 137****6666</div>
      <div class="items">红烧土鸡块×1、麻婆豆腐×1、米饭×2</div>
      <div class="order-foot">
        <span class="total">¥42.5</span>
        <div class="actions">
          <div class="btn btn-danger">拒单</div>
          <div class="btn btn-primary">接单</div>
        </div>
      </div>
    </div>

    <!-- 制作中 -->
    <div class="order-card">
      <div class="order-head">
        <span class="order-no">订单 #20261022000</span>
        <span class="status cooking">制作中</span>
      </div>
      <div class="cust-row">
        <span class="cust-name">张大山</span>
        <div class="call-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.72.37 1.42.72 2.06a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.66.36 1.36.61 2.08.73A2 2 0 0 1 22 16.92z"/></svg>
        </div>
      </div>
      <div class="cust-addr">绿杨乡中学 · 135****9999</div>
      <div class="items">手撕包菜×1、西红柿炒蛋×1、米饭×3</div>
      <div class="order-foot">
        <span class="total">¥28.0</span>
        <div class="actions">
          <div class="btn btn-primary">通知出餐</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
