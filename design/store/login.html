<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>曙光跑腿商家端 - 登录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { width:375px; height:812px; overflow:hidden; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:linear-gradient(180deg,#FF8A3D 0%,#FF6B2C 50%,#F5F6F8 50%);
    display:flex; flex-direction:column;
  }
  .statusbar { height:54px; }
  .header { padding:0 24px 30px; color:#fff; }
  .logo {
    width:56px; height:56px; border-radius:14px; background:rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  }
  .title { font-size:26px; font-weight:700; }
  .subtitle { font-size:14px; opacity:.9; margin-top:6px; }
  .form-card {
    margin:0 16px; background:#fff; border-radius:16px; padding:24px 20px;
    box-shadow:0 8px 32px rgba(0,0,0,.08);
  }
  .input-group { margin-bottom:16px; }
  .input-label { font-size:13px; color:#86909C; margin-bottom:8px; display:block; }
  .input-row {
    display:flex; align-items:center; border-bottom:1px solid #F2F3F5; padding:12px 0;
  }
  .prefix { font-size:15px; color:#1D2129; padding-right:12px; border-right:1px solid #E5E6EB; margin-right:12px; }
  .input-row input {
    flex:1; border:none; outline:none; font-size:16px; color:#1D2129; background:transparent;
  }
  .input-row input::placeholder { color:#C9CDD4; }
  .code-btn {
    color:#FF6B2C; font-size:13px; white-space:nowrap; cursor:pointer;
  }
  .submit-btn {
    width:100%; height:48px; background:linear-gradient(135deg,#FF8A3D,#FF5A1F);
    color:#fff; border:none; border-radius:24px; font-size:16px; font-weight:600;
    margin-top:8px;
  }
  .agreement {
    display:flex; align-items:flex-start; gap:6px; margin-top:14px;
    font-size:11px; color:#86909C; line-height:1.5;
  }
  .check {
    width:14px; height:14px; border-radius:50%; background:#FF6B2C; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .agreement a { color:#FF6B2C; text-decoration:none; }
  .footer-tip {
    text-align:center; font-size:12px; color:#86909C; margin-top:auto; padding-bottom:30px;
  }
  .footer-tip a { color:#FF6B2C; text-decoration:none; }
</style>
</head>
<body>
  <div class="statusbar"></div>
  <div class="header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M4 11l1 9h14l1-9"/></svg>
    </div>
    <div class="title">商家端登录</div>
    <div class="subtitle">开通你的店铺，让周边村民都能点到你的菜</div>
  </div>
  <div class="form-card">
    <div class="input-group">
      <label class="input-label">手机号</label>
      <div class="input-row">
        <span class="prefix">+86</span>
        <input type="tel" placeholder="请输入店主手机号" value="138 8888 8888">
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">验证码</label>
      <div class="input-row">
        <input type="text" placeholder="请输入6位验证码">
        <span class="code-btn">获取验证码</span>
      </div>
    </div>
    <button class="submit-btn">登录 / 入驻</button>
    <div class="agreement">
      <div class="check">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span>我已阅读并同意<a>《商家入驻协议》</a>和<a>《平台规则》</a>，乡镇商家免佣金试运营3个月</span>
    </div>
  </div>
  <div class="footer-tip">还没有店铺？<a>免费入驻开店</a></div>
</body>
</html>
