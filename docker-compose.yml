services:
  postgres:
    image: postgres:16-alpine
    container_name: dawn-errand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawn_errand}
      POSTGRES_USER: ${POSTGRES_USER:-dawn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawn_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - dawn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dawn} -d ${POSTGRES_DB:-dawn_errand}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: dawn-errand-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dawn_dev_only}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - dawn-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dawn_dev_only} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dawn-postgres-data:
  dawn-redis-data:
